spring.application.name=appointment-system
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/medical_db
spring.datasource.username=medical_user
spring.datasource.password=medical_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=ThisIsAVeryLongSecretKeyThatMustBeAtLeast256BitsLong1234567890
app.jwt.expiration-ms=86400000

spring.mail.host=smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=password321
spring.mail.password=password321
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.medical=INFO